# Phase 1-4 local dev stack. Kubernetes manifests (deploy/k8s) replace this in Phase 5.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fleetwatch
      POSTGRES_PASSWORD: fleetwatch
      POSTGRES_DB: fleetwatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports: ["9092:9092"]

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs,dynamodb,iam
    ports: ["4566:4566"]

volumes:
  pgdata:
